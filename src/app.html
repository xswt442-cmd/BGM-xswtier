<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// 首帧预置主题与语言：水合前读 localStorage 直接挂类/设 lang。
			// applyTheme 在 onMount 才跑，缺这段时深色与中文用户会先看到一帧默认暖阳英文（FOUC）。
			// 键名/合法值须与 theme.svelte.ts / locale.svelte.ts 保持同步，两处同改。
			(function () {
				try {
					var root = document.documentElement;
					var pick = function (key, fallback, allowed) {
						var v = localStorage.getItem(key);
						return allowed.indexOf(v) !== -1 ? v : fallback;
					};
					var scheme = pick('bgmtier-scheme', 'sun', ['sun', 'dark', 'sky']);
					// 兼容旧 bgmtier-effects 键（与 theme.svelte.ts 同款回退）
					var vfxRaw = localStorage.getItem('bgmtier-vfx') || localStorage.getItem('bgmtier-effects');
					var vfx = ['none', 'neon', 'crt'].indexOf(vfxRaw) !== -1 ? vfxRaw : 'none';
					var uifbRaw = localStorage.getItem('bgmtier-uifb') || localStorage.getItem('bgmtier-effects');
					var uifb = ['none', 'arcade', 'pulse'].indexOf(uifbRaw) !== -1 ? uifbRaw : 'none';
					root.classList.add('theme-' + scheme, 'effects-' + vfx, 'feedback-' + uifb);
					root.lang = pick('bgmtier-locale', 'en', ['en', 'zh']);
				} catch (e) {
					/* localStorage 不可用时保持默认，交回 onMount 的 applyTheme */
				}
			})();
		</script>
		<meta name="text-scale" content="scale" />
		<title>BGM-xswtier — Bangumi Anime Tier List</title>
		<meta name="description" content="Create, rank and share pixel-style Bangumi anime tier lists." />
		<meta name="application-name" content="BGM-xswtier" />
		<meta name="theme-color" content="#f97316" />
		<link rel="canonical" href="https://bgm-xswtier.xswt.fyi/" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="BGM-xswtier" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:locale:alternate" content="zh_CN" />
		<meta property="og:title" content="BGM-xswtier — Bangumi Anime Tier List" />
		<meta property="og:description" content="Create, rank and share pixel-style Bangumi anime tier lists." />
		<meta property="og:url" content="https://bgm-xswtier.xswt.fyi/" />
		<meta property="og:image" content="https://bgm-xswtier.xswt.fyi/og-cover.png" />
		<meta property="og:image:width" content="1672" />
		<meta property="og:image:height" content="941" />
		<meta property="og:image:alt" content="A pixel-art tier list against a warm sunset sky" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="BGM-xswtier — Bangumi Anime Tier List" />
		<meta name="twitter:description" content="Create, rank and share pixel-style Bangumi anime tier lists." />
		<meta name="twitter:image" content="https://bgm-xswtier.xswt.fyi/og-cover.png" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
